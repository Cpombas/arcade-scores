<!DOCTYPE html>
<html lang="en">

  
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ADMIN — ARCADE HIGH SCORES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --purple-deep: #1a0033;
    --purple-mid: #3d0070;
    --purple-bright: #8b00ff;
    --purple-glow: #b44dff;
    --gold: #ffd700;
    --gold-light: #ffe566;
    --gold-dark: #b8860b;
    --silver: #c0c0c0;
    --bronze: #cd7f32;
    --yellow: #ffee00;
    --yellow-dim: #ccbb00;
    --white: #fff8e7;
    --red: #ff4466;
    --green: #44ff88;
    --scanline: rgba(0,0,0,0.08);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background-color: var(--purple-deep);
    background-image:
      repeating-linear-gradient(0deg, var(--scanline) 0px, var(--scanline) 1px, transparent 1px, transparent 4px),
      radial-gradient(ellipse at 50% 0%, #3d007080 0%, transparent 70%);
    min-height: 100vh;
    font-family: 'Press Start 2P', monospace;
    color: var(--white);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 60px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: linear-gradient(transparent 50%, rgba(0,0,0,0.04) 50%);
    background-size: 100% 4px;
    pointer-events: none;
    z-index: 100;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    border: 6px solid var(--purple-bright);
    box-shadow: inset 0 0 40px rgba(139,0,255,0.3), 0 0 40px rgba(139,0,255,0.3);
    pointer-events: none;
    z-index: 99;
  }

  /* ── LOGIN OVERLAY ── */
  #login-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,0,20,0.97);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 200;
    gap: 24px;
  }

  .login-title {
    font-size: clamp(12px, 3vw, 18px);
    color: var(--gold);
    text-shadow: 0 0 16px var(--gold);
    text-align: center;
    line-height: 1.8;
  }

  .login-box {
    border: 3px solid var(--purple-bright);
    background: rgba(61,0,112,0.4);
    padding: 32px;
    clip-path: polygon(0 8px, 8px 0, calc(100% - 8px) 0, 100% 8px, 100% calc(100% - 8px), calc(100% - 8px) 100%, 8px 100%, 0 calc(100% - 8px));
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-width: 280px;
    box-shadow: 0 0 30px rgba(139,0,255,0.4);
  }

  .login-label {
    font-size: 9px;
    color: var(--purple-glow);
    letter-spacing: 3px;
  }

  .login-input {
    background: rgba(0,0,0,0.5);
    border: 2px solid var(--purple-mid);
    color: var(--yellow);
    font-family: 'VT323', monospace;
    font-size: 22px;
    padding: 8px 12px;
    width: 100%;
    outline: none;
    letter-spacing: 4px;
    transition: border-color 0.2s;
  }

  .login-input:focus { border-color: var(--purple-glow); }

  .login-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 10px;
    background: var(--purple-mid);
    color: var(--gold);
    border: 2px solid var(--gold);
    padding: 12px;
    cursor: pointer;
    letter-spacing: 2px;
    transition: all 0.2s;
    clip-path: polygon(0 4px, 4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px));
  }

  .login-btn:hover {
    background: var(--purple-bright);
    box-shadow: 0 0 16px var(--gold);
    color: var(--gold-light);
  }

  .login-error {
    font-family: 'VT323', monospace;
    font-size: 20px;
    color: var(--red);
    text-align: center;
    text-shadow: 0 0 8px var(--red);
    display: none;
    animation: shake 0.4s ease;
  }

  .login-error.show { display: block; }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX( 6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX( 4px); }
  }

  /* ── ADMIN PANEL ── */
  #admin-panel {
    width: min(1400px, 100%);
    display: none;
    flex-direction: column;
    animation: fadeUp 0.5s ease both;
  }

  #admin-panel.visible { display: flex; }

  .admin-header {
    text-align: center;
    margin-bottom: 28px;
  }

  .admin-title {
    font-size: clamp(12px, 3vw, 20px);
    color: var(--red);
    text-shadow: 0 0 12px var(--red);
    margin-bottom: 6px;
  }

  .admin-sub {
    font-family: 'VT323', monospace;
    font-size: 18px;
    color: var(--purple-glow);
    letter-spacing: 4px;
  }

  .divider {
    width: 100%;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold), var(--purple-bright), var(--gold), transparent);
    margin: 16px 0 24px;
    box-shadow: 0 0 12px var(--gold);
  }

  /* ── TWO COLUMN EDITOR ── */
  .editor-columns {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    width: 100%;
    align-items: start;
  }

  .editor-col {
    padding: 0 20px;
  }

  .editor-col:first-child {
    border-right: 2px solid var(--purple-mid);
  }

  .col-title {
    font-size: 10px;
    color: var(--gold);
    text-shadow: 0 0 8px var(--gold);
    text-align: center;
    letter-spacing: 5px;
    margin-bottom: 16px;
  }

  /* ── TABLE ── */
  .score-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0 5px;
  }

  .score-table thead tr th {
    font-size: 8px;
    color: var(--purple-glow);
    text-align: left;
    padding: 6px 12px;
    letter-spacing: 3px;
    border-bottom: 2px solid var(--purple-mid);
  }

  .score-table thead tr th:first-child { width: 44px; }
  .score-table thead tr th:last-child  { width: 90px; text-align: center; }

  .score-row {
    background: rgba(61,0,112,0.2);
    border: 2px solid var(--purple-mid);
    transition: all 0.2s;
  }

  .score-row:hover { border-color: var(--purple-glow); background: rgba(61,0,112,0.4); }

  .score-row td {
    padding: 0;
    vertical-align: middle;
  }

  .score-row td:first-child { padding: 0 0 0 12px; }

  .rank-badge {
    font-size: 9px;
    color: var(--purple-glow);
    text-shadow: 0 0 6px var(--purple-bright);
  }

  .rank-badge.gold   { color: var(--gold);   text-shadow: 0 0 8px var(--gold); }
  .rank-badge.silver { color: var(--silver); text-shadow: 0 0 8px var(--silver); }
  .rank-badge.bronze { color: var(--bronze); text-shadow: 0 0 8px var(--bronze); }

  .cell-input {
    background: transparent;
    border: none;
    color: var(--white);
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    padding: 12px 12px;
    width: 100%;
    outline: none;
    transition: background 0.2s;
  }

  .cell-input.score-input {
    color: var(--yellow);
    text-shadow: 0 0 6px var(--yellow-dim);
  }

  .cell-input:focus { background: rgba(139,0,255,0.15); }
  .cell-input::placeholder { color: var(--purple-mid); }

  .btn-del {
    font-family: 'Press Start 2P', monospace;
    font-size: 7px;
    background: transparent;
    color: var(--red);
    border: 1px solid var(--red);
    padding: 5px 8px;
    cursor: pointer;
    transition: all 0.2s;
    display: block;
    margin: auto;
    opacity: 0.6;
  }

  .btn-del:hover { opacity: 1; background: rgba(255,68,102,0.15); box-shadow: 0 0 10px rgba(255,68,102,0.4); }

  /* ── PER-COLUMN CONTROLS ── */
  .col-controls {
    display: flex;
    gap: 10px;
    margin-top: 14px;
    flex-wrap: wrap;
    justify-content: center;
  }

  /* ── BOTTOM CONTROLS ── */
  .controls {
    display: flex;
    gap: 12px;
    margin-top: 28px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 9px;
    padding: 12px 20px;
    cursor: pointer;
    letter-spacing: 1px;
    border: 2px solid;
    transition: all 0.2s;
    clip-path: polygon(0 4px, 4px 0, calc(100% - 4px) 0, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0 calc(100% - 4px));
  }

  .btn-add {
    background: rgba(68,255,136,0.1);
    color: var(--green);
    border-color: var(--green);
    font-size: 8px;
    padding: 10px 14px;
  }
  .btn-add:hover { background: rgba(68,255,136,0.2); box-shadow: 0 0 14px rgba(68,255,136,0.4); }

  .btn-save {
    background: rgba(255,215,0,0.15);
    color: var(--gold);
    border-color: var(--gold);
    font-size: 8px;
    padding: 10px 14px;
  }
  .btn-save:hover { background: rgba(255,215,0,0.25); box-shadow: 0 0 16px rgba(255,215,0,0.5); }

  .btn-back {
    background: rgba(180,77,255,0.1);
    color: var(--purple-glow);
    border-color: var(--purple-glow);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
  }
  .btn-back:hover { background: rgba(180,77,255,0.2); box-shadow: 0 0 14px rgba(180,77,255,0.4); }

  .btn-logout {
    background: rgba(255,68,102,0.1);
    color: var(--red);
    border-color: var(--red);
  }
  .btn-logout:hover { background: rgba(255,68,102,0.2); box-shadow: 0 0 14px rgba(255,68,102,0.4); }

  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: rgba(68,255,136,0.15);
    border: 2px solid var(--green);
    color: var(--green);
    font-family: 'VT323', monospace;
    font-size: 22px;
    padding: 10px 24px;
    letter-spacing: 3px;
    z-index: 300;
    transition: transform 0.4s ease;
    text-shadow: 0 0 10px var(--green);
    box-shadow: 0 0 20px rgba(68,255,136,0.3);
    white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .hint {
    font-family: 'VT323', monospace;
    font-size: 14px;
    color: rgba(180,77,255,0.35);
    text-align: center;
    letter-spacing: 2px;
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 800px) {
    .editor-columns {
      grid-template-columns: 1fr;
    }
    .editor-col:first-child {
      border-right: none;
      border-bottom: 2px solid var(--purple-mid);
      padding-bottom: 28px;
      margin-bottom: 28px;
    }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-overlay">
  <div class="login-title">⚠ ADMIN ACCESS ⚠<br><br>ENTER PASSWORD</div>
  <div class="login-box">
    <div class="login-label">USERNAME</div>
    <input type="text" class="login-input" id="user-input" placeholder="ADMIN" autocomplete="off">
    <div class="login-label">PASSWORD</div>
    <input type="password" class="login-input" id="pw-input" placeholder="••••••••" autocomplete="off">
    <div class="login-error" id="pw-error">ACCESS DENIED</div>
    <button class="login-btn" onclick="tryLogin()">▶ ENTER</button>
  </div>
  <div class="hint">hint: change it in admin.html</div>
</div>

<!-- ADMIN PANEL -->
<div id="admin-panel">
  <div class="admin-header">
    <div class="admin-title">⚡ ADMIN PANEL ⚡</div>
    <div class="admin-sub">SCORE EDITOR</div>
  </div>

  <div class="divider"></div>

  <div class="editor-columns">

    <!-- ── BK 1 ── -->
    <div class="editor-col">
      <div class="col-title">— B K 1 —</div>
      <table class="score-table">
        <thead>
          <tr>
            <th>#</th>
            <th>NAME</th>
            <th>SCORE</th>
            <th>DEL</th>
          </tr>
        </thead>
        <tbody id="tbody-bk1"></tbody>
      </table>
      <div class="col-controls">
        <button class="btn btn-add" onclick="addRow('bk1')">+ ADD</button>
        <button class="btn btn-save" onclick="saveCol('bk1')">💾 SAVE BK1</button>
      </div>
    </div>

    <!-- ── BK 2 ── -->
    <div class="editor-col">
      <div class="col-title">— B K 2 —</div>
      <table class="score-table">
        <thead>
          <tr>
            <th>#</th>
            <th>NAME</th>
            <th>SCORE</th>
            <th>DEL</th>
          </tr>
        </thead>
        <tbody id="tbody-bk2"></tbody>
      </table>
      <div class="col-controls">
        <button class="btn btn-add" onclick="addRow('bk2')">+ ADD</button>
        <button class="btn btn-save" onclick="saveCol('bk2')">💾 SAVE BK2</button>
      </div>
    </div>

  </div>

  <div class="controls">
    <button class="btn btn-save" onclick="saveAll()">💾 SAVE ALL</button>
    <a href="index.html" class="btn btn-back">◀ VIEW BOARD</a>
    <button class="btn btn-logout" onclick="logout()">✕ LOGOUT</button>
  </div>
</div>

<div class="toast" id="toast">✔ SAVED!</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const { createClient } = window.supabase;

const supabase = createClient(
  "https://kkgcspkqllcyarltavbn.supabase.co",
  "sb_publishable_AHK9PIHuUbUPCkxa8HI0KA_KQFpbMSr"
);
</script>

<script>

const DEFAULTS = {
  bk1: [
    { name: "THUNDERBOLT", score: 999999 },
    { name: "PIXEL QUEEN", score: 847200 },
    { name: "NEON WOLF",   score: 720500 },
    { name: "STARDUST",    score: 610000 },
    { name: "LAZERBEAK",   score: 555200 },
    { name: "VORTEX",      score: 480100 },
    { name: "CYBERGHOST",  score: 390750 },
    { name: "IRONPULSE",   score: 312400 },
    { name: "SHADOWFOX",   score: 255000 },
    { name: "GALACTIC",    score: 198600 },
    { name: "ROCKETMAN",   score: 145300 },
    { name: "PIXELDUST",   score: 88800  },
    { name: "NEWPLAYER",   score: 42000  },
  ],
  bk2: [
    { name: "STARLORD",    score: 875000 },
    { name: "NINJABYTE",   score: 760300 },
    { name: "BLAZERUNNER", score: 620100 },
    { name: "COMETFALL",   score: 510000 },
    { name: "VOXEL",       score: 445500 },
    { name: "DARKPULSE",   score: 370200 },
    { name: "GLITCHWAVE",  score: 295000 },
    { name: "HYPERION",    score: 210800 },
    { name: "NEBULAX",     score: 158400 },
    { name: "SPECTRAL",    score: 99100  },
    { name: "PRISMATIC",   score: 67500  },
    { name: "NEWENTRY",    score: 31000  },
  ],
};

const STORAGE_KEYS = { bk1: 'arcade_scores_bk1', bk2: 'arcade_scores_bk2' };
const MAX_ROWS = { bk1: 13, bk2: 12 };

function getScores(col) {
  const raw = localStorage.getItem(STORAGE_KEYS[col]);
  if (raw) return JSON.parse(raw);
  return JSON.parse(JSON.stringify(DEFAULTS[col]));
}

async function tryLogin() {
  const username = document.getElementById('user-input').value.trim();
  const password = document.getElementById('pw-input').value;

  const { data, error } = await supabase
    .from('admins')
    .select('*')
    .eq('username', username)
    .eq('password', password)
    .single();

  if (data) {
    document.getElementById('login-overlay').style.display = 'none';
    document.getElementById('admin-panel').classList.add('visible');
    loadFromDB();
  } else {
    const err = document.getElementById('pw-error');
    err.classList.add('show');
    document.getElementById('pw-input').value = '';
    setTimeout(() => err.classList.remove('show'), 2000);
  }
}

document.getElementById('pw-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') tryLogin();
});

function rankClass(i) {
  if (i === 0) return 'gold';
  if (i === 1) return 'silver';
  if (i === 2) return 'bronze';
  return '';
}

function renderTable(col) {
  const scores = getScores(col);
  const tbody = document.getElementById(`tbody-${col}`);
  tbody.innerHTML = '';
  scores.slice(0, MAX_ROWS[col]).forEach((s, i) => addRowData(col, i + 1, s.name, s.score));
}

async function loadFromDB() {
  const { data, error } = await supabase
    .from('scores')
    .select('*')
    .order('score', { ascending: false });

  const bk1 = data.filter(x => x.board === 'bk1');
  const bk2 = data.filter(x => x.board === 'bk2');

  renderTableFromData('bk1', bk1);
  renderTableFromData('bk2', bk2);
}

function renderTableFromData(col, scores) {
  const tbody = document.getElementById(`tbody-${col}`);
  tbody.innerHTML = '';
  scores.forEach((s, i) => addRowData(col, i + 1, s.name, s.score));
}

function addRowData(col, rank, name, score) {
  const tbody = document.getElementById(`tbody-${col}`);
  const i = tbody.querySelectorAll('tr').length;
  const displayRank = rank || i + 1;
  const tr = document.createElement('tr');
  tr.className = 'score-row';
  tr.innerHTML = `
    <td><span class="rank-badge ${rankClass(i)}">#${displayRank}</span></td>
    <td><input class="cell-input name-input" placeholder="PLAYER NAME" value="${escHtml(name || '')}" maxlength="20"></td>
    <td><input class="cell-input score-input" placeholder="0" type="number" min="0" value="${score || 0}"></td>
    <td><button class="btn-del" onclick="delRow(this, '${col}')">✕</button></td>
  `;
  tbody.appendChild(tr);
}

function addRow(col) {
  const tbody = document.getElementById(`tbody-${col}`);
  if (tbody.querySelectorAll('tr').length >= MAX_ROWS[col]) {
    showToast(`MAX ${MAX_ROWS[col]} PLAYERS!`, '#ff4466');
    return;
  }
  addRowData(col, tbody.querySelectorAll('tr').length + 1, '', 0);
  renumberRanks(col);
}

function delRow(btn, col) {
  btn.closest('tr').remove();
  renumberRanks(col);
}

function renumberRanks(col) {
  document.querySelectorAll(`#tbody-${col} .rank-badge`).forEach((el, i) => {
    el.textContent = `#${i + 1}`;
    el.className = `rank-badge ${rankClass(i)}`;
  });
}

async function saveCol(col) {
  const rows = document.querySelectorAll(`#tbody-${col} .score-row`);
  const scores = [];

  rows.forEach(row => {
    const name = row.querySelector('.name-input').value.trim();
    const score = parseInt(row.querySelector('.score-input').value) || 0;
    if (name) scores.push({ name, score, board: col });
  });

  // delete old
  await supabase.from('scores').delete().eq('board', col);

  // insert new
  await supabase.from('scores').insert(scores);

  showToast(`✔ ${col.toUpperCase()} SAVED!`, '#44ff88');
}

function saveAll() {
  saveCol('bk1');
  saveCol('bk2');
  showToast('✔ ALL SAVED!', '#44ff88');
}

function logout() {
  document.getElementById('admin-panel').classList.remove('visible');
  document.getElementById('login-overlay').style.display = 'flex';
  document.getElementById('pw-input').value = '';
}

function showToast(msg, color) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.color = color || '#44ff88';
  t.style.borderColor = color || '#44ff88';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
</script>
</body>
</html>
